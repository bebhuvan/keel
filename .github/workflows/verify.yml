name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git clang qt6-base qt6-declarative qt6-wayland gitleaks
      # Pinned to a commit, not a tag, so a moved tag can't change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bin/verify
